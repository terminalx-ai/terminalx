# 25.01 First run: the Cloud tab with nothing set up, half-way, ready to launch, and when a step cannot be done.
# Step 1 is done as a person does it: Start setup, then Continue on the organization page.
appId: com.terminalx.phone.fixture
# The boards are drawn in Ember when dark and in Den when light: MAESTRO_THEME=Den for the light run.
env:
  THEME: ${MAESTRO_THEME || "Ember"}
name: First run (25.01)
# The steps are asserted by their rows: a step's button is there only when its page is in the app
# (compute, agent logins and launching are PRO-528, PRO-529 and PRO-530).
---
- launchApp:
    clearState: true
    arguments: { fixtureScenario: connected, fixtureSetup: first-run }
- tapOn: "Settings"
- scrollUntilVisible:
    element: "${THEME} theme"
- tapOn: "${THEME} theme"
- tapOn: "Cloud"
- assertVisible: "Start setup"
- takeScreenshot: 25.01-1-nothing-set-up
- tapOn: "Start setup"
- assertVisible: "Continue with the personal one"
- waitForAnimationToEnd
- takeScreenshot: 25.02-1-a-new-account
- tapOn: "Continue with the personal one"
- assertVisible: "Step 2 of 4, next: Connect compute.*"
- takeScreenshot: 25.01-2-organization-chosen
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: half-way }
- tapOn: "Cloud"
- assertVisible: "Step 3 of 4, next: Sign your agents in.*"
- takeScreenshot: 25.01-3-came-back-half-way
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: ready }
- tapOn: "Cloud"
- assertVisible: "Step 4 of 4, next: Launch a workspace.*"
- takeScreenshot: 25.01-4-ready-to-launch
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: with-workspaces }
- tapOn: "Cloud"
- assertVisible: "Set up cloud workspaces, 2 of 4 steps done"
- takeScreenshot: 25.01-5-with-workspaces
- tapOn: "Set up cloud workspaces, 2 of 4 steps done"
- assertVisible: "Step 3 of 4, next: Sign your agents in.*"
- waitForAnimationToEnd
- takeScreenshot: 25.01-5b-the-folded-steps
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: attention }
- tapOn: "Cloud"
- assertVisible: "Step 2 of 4.*Boat rejected the stored key on its last check.*"
- takeScreenshot: 25.01-7-key-stopped-working
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: unread }
- tapOn: "Cloud"
- assertVisible: "Pull down to read it again."
- takeScreenshot: 25.01-9-step-could-not-be-read
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureSetup: offline-later }
- tapOn: "Cloud"
- assertVisible: "Step 3 of 4, next: Sign your agents in.*"
# The service stops answering 15 s after launch; the next read of the list finds it gone.
- extendedWaitUntil:
    visible: "Setup carries on when the phone is back online. Nothing you finished is lost."
    timeout: 60000
- takeScreenshot: 25.01-8-no-network
