# 22.07 Notification settings: the Settings row, the page, a session's own choice, and what
# reaches the lock screen at "Everything" and at "Nothing". iOS notifications off is flow-22.07-off.yaml.
# Maestro grants notifications at each launch, as a person who allowed them would have.
appId: com.terminalx.phone.fixture
name: Notification settings (22.07)
---
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected }
- tapOn: "Settings"
- assertVisible: "Notifications, Questions, approvals, finished, failed"
- takeScreenshot: 22.07-1-settings-entry
- tapOn: "Notifications, Questions, approvals, finished, failed"
- assertVisible: "Asks a question"
- waitForAnimationToEnd
- takeScreenshot: 22.07-2-what-to-notify
- scrollUntilVisible:
    element: "Sound, Default"
- waitForAnimationToEnd
- takeScreenshot: 22.07-3-where-and-when
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureTabs: states }
- tapOn:
    id: sessions-tab
- tapOn: "Review and merge,.*"
- tapOn: "Review and merge, Working.*"
- waitForAnimationToEnd
- tapOn: "Notifications for this session"
- assertVisible: "Use my settings"
- waitForAnimationToEnd
- takeScreenshot: 22.07-5-one-session
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureLockScreen: everything }
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- pressKey: home
# The banners go before the list opens: iOS shows each for a few seconds.
- extendedWaitUntil:
    notVisible: ".*(needs|finished).*"
    timeout: 20000
    optional: true
- swipe:
    start: 15%, 0%
    end: 15%, 60%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: 22.07-6-lock-screen-full-detail
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureLockScreen: nothing }
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- pressKey: home
# The banners go before the list opens: iOS shows each for a few seconds.
- extendedWaitUntil:
    notVisible: ".*(needs|finished).*"
    timeout: 20000
    optional: true
- swipe:
    start: 15%, 0%
    end: 15%, 60%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: 22.07-7-lock-screen-details-hidden
