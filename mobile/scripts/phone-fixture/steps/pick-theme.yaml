# On Settings, the theme the boards are drawn in (Ember dark, Den light), then back to the top.
appId: com.terminalx.phone.fixture
---
- tapOn: "Settings"
- scrollUntilVisible:
    element: "${THEME} theme"
    centerElement: true
- tapOn: "${THEME} theme"
- scrollUntilVisible:
    element:
      text: "Account.*"
    direction: UP
