# 26.01 Delete account (PRO-584): the row, the page for a plain account, typing, deleting, done; blocked;
# a workspace that did not stop; a refusal; a stale sign-in; offline; the final deletion running; the cancelled notice.
appId: com.terminalx.phone.fixture
name: Delete account (26.01)
---
- launchApp:
    clearState: true
    arguments: { fixtureScenario: connected, fixtureDeletion: running }
- tapOn: "Settings"
- tapOn:
    text: "Account.*"
- waitForAnimationToEnd
- takeScreenshot: 26.01-01-account-row
- runFlow: steps/open-delete-account.yaml
- takeScreenshot: 26.01-02-page-top
- scrollUntilVisible:
    element:
      id: delete-account-email
- takeScreenshot: 26.01-03-page-confirm
- tapOn:
    id: delete-account-email
- inputText: "alex@example.co"
- hideKeyboard
- takeScreenshot: 26.01-04-mismatch
- tapOn:
    id: delete-account-email
- inputText: "m"
- hideKeyboard
- takeScreenshot: 26.01-05-ready
- tapOn:
    id: delete-account-confirm
- takeScreenshot: 26.01-06-stopping
- extendedWaitUntil:
    visible:
      id: delete-account-done
    timeout: 30000
- takeScreenshot: 26.01-07-scheduled
- tapOn:
    id: delete-account-done
- waitForAnimationToEnd
- takeScreenshot: 26.01-08-settings-pending

