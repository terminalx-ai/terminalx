- extendedWaitUntil:
    visible: "Review price"
    timeout: 15000
- tapOn:
    id: "launch-repository"
- inputText: "github.com/acme/app"
- tapOn: "Use this repository"
- tapOn:
    id: "launch-name"
- inputText: "Checkout redesign"
- pressKey: Enter
- tapOn: "Review price"
- extendedWaitUntil:
    visible: "Two things to fix before this can be priced"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 25.05-11-two-things-to-fix
- launchApp:
    stopApp: true
    arguments: { fixtureScenario: connected, fixtureLaunch: private, openRoute: "/cloud/launch?orgId=org-northwind" }
- extendedWaitUntil:
    visible: "Review price"
    timeout: 15000
- tapOn:
    id: "launch-repository"
- inputText: "https://github.com/acme/app"
- tapOn:
    id: "launch-repository-ref"
