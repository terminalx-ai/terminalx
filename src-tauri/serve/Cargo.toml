[package]
name = "terminalx-serve"
version = "0.2.2"
description = "Headless TerminalX runtime for cloud workspaces"
authors = ["Paresh Dudhat"]
edition = "2021"
license = "MIT"
publish = false

# The cloud runtime protocol this build speaks, published in each release's
# terminalx-serve.json. The TerminalX cloud server refuses runtimes below its
# minimum. Bump it when a change needs a matching server (bootstrap, launch
# intents, runtime API). 1 = launch intents and the serve bootstrap (PRO-21).
[package.metadata.terminalx]
runtime-protocol = 1

[[bin]]
name = "terminalx-serve"
path = "src/main.rs"

[dependencies]
# Without the default `desktop` feature: no Tauri, WebView, GTK or audio.
raccoon = { path = "..", default-features = false }

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
