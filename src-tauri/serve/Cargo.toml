[package]
name = "terminalx-serve"
version = "0.2.2"
description = "Headless TerminalX runtime for cloud workspaces"
authors = ["Paresh Dudhat"]
edition = "2021"
license = "MIT"
publish = false

# The cloud runtime protocol this build speaks, published in each release's
# terminalx-serve.json. A TerminalX cloud server installs only runtimes whose
# protocol is within the range it implements. Bump it when a change needs a
# matching server (bootstrap, launch intents, runtime API).
# 1 = launch intents and the serve bootstrap (PRO-21).
# 2 = scheduled runs: claims them, reports them and ends a turn at the
#     schedule's limit (PRO-37).
# 3 = types a public API message into the tab its run names (`target`),
#     refusing a tab that is gone or mid-turn (PRO-40).
[package.metadata.terminalx]
runtime-protocol = 3

[[bin]]
name = "terminalx-serve"
path = "src/main.rs"

[features]
local-ui = ["raccoon/local-ui"]

[dependencies]
# Without the default `desktop` feature: no Tauri, WebView, GTK or audio.
raccoon = { path = "..", default-features = false }

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
# The test relay seals and checks the host challenge as the runtime opens it.
crypto_box = { version = "0.9.1", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = "0.28"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "local_supervisor"
path = "tests/local_supervisor.rs"
harness = false

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
