[package]
name = "raccoon"
version = "0.2.7"
description = "TerminalX — a desktop workbench for coding agents"
authors = ["Paresh Dudhat"]
edition = "2021"
license = "MIT"

[lib]
name = "raccoon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop app. `terminalx-serve` builds the library without it, so a
# Linux cloud workspace needs no WebView, GTK or audio libraries.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-window-state",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-updater",
    "dep:cpal",
    # macOS only: keychain, AppKit alerts, dictation and local transcription.
    "dep:security-framework",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-av-foundation",
    "dep:objc2-avf-audio",
    "dep:block2",
    "dep:objc2-foundation",
    "dep:objc2-speech",
    "dep:transcribe-cpp",
]

[[bin]]
name = "raccoon"
path = "src/main.rs"
required-features = ["desktop"]

[workspace]
members = ["serve"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tempfile = "3"
aes-gcm = "0.10.3"
flate2 = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-range = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
thiserror = "2"
anyhow = "1"
dirs = "6"
portable-pty = "0.9"
notify = "8"
notify-debouncer-mini = "0.6"
base64 = "0.22"
crypto_box = { version = "0.9.1", features = ["std"] }
crypto_secretbox = { version = "0.1.1", features = ["std"] }
futures-util = "0.3"
hkdf = "0.12.4"
hmac = "0.12"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "hkdfsha2", "x25519"] }
if-addrs = "0.15"
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
log = "0.4"
env_logger = "0.11"
which = "7"
regex = "1"
salsa20 = "0.10"
ignore = "0.4"
nucleo-matcher = "0.3"
tauri-plugin-notification = { version = "2.4.0", optional = true }
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = { version = "2.11.0", optional = true }
cpal = { version = "0.17", optional = true }
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"
toml = "0.9"
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSSecureTextField", "NSTextField", "NSWindow", "NSResponder", "NSView", "NSColor"], optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"], optional = true }
objc2-avf-audio = { version = "0.3", features = ["AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes", "block2"], optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSBundle", "NSDictionary"], optional = true }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognitionTaskHint", "SFTranscription", "SFTranscriptionSegment", "SFErrors", "block2", "objc2-avf-audio"], optional = true }
transcribe-cpp = { version = "0.2", default-features = false, features = ["metal"], optional = true }

[profile.dev]
incremental = true
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# tests/serde_field_naming.rs parses the source to check serde field naming.
syn = { version = "2", features = ["full", "visit"] }
