# Codex settings
model = "gpt-5.1-codex"
model_reasoning_effort = "high"

[features]
web_search_request = true

# Sentry, the self-hosted one
[mcp_servers.sentry]
url = "https://sentry.internal.example.com/mcp"
bearer_token_env_var = "SENTRY_TOKEN"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20

[mcp_servers.github]
command = "gh"
args = ["mcp-server"]
env_vars = ["GITHUB_TOKEN"]

[projects."/Users/example/code/app"]
trust_level = "trusted"
