[package]
name = "terminalx-vm-bootstrap"
version = "0.1.0"
description = "TerminalX macOS VM first-boot guest helper, validation probe and offline seeder core"
authors = ["Paresh Dudhat"]
edition = "2021"
license = "MIT"
publish = false

# Standalone: a small guest/seed component never links the desktop app.
[workspace]

[[bin]]
name = "terminalx-vm-bootstrap"
path = "src/bin/helper.rs"

[[bin]]
name = "terminalx-vm-validation-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "terminalx-vm-seed"
path = "src/bin/seed.rs"

# Exact versions already locked by src-tauri, so builds stay offline.
[dependencies]
base64 = "=0.22.1"
hkdf = "=0.12.4"
hmac = "=0.12.1"
libc = "=0.2.189"
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
