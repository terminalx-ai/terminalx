<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/raccoon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerminalX</title>
    <script>
      // Stamp theme + mode before first paint so the window never flashes.
      (function () {
        try {
          var t = localStorage.getItem("raccoon.theme") || "den";
          var m = localStorage.getItem("raccoon.mode") || "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = m === "system" ? (dark ? "dark" : "light") : m;
          var root = document.documentElement;
          root.setAttribute("data-theme", t);
          root.setAttribute("data-mode", resolved);
          // Glass (the desktop tinted through the window) is the Mac look, off
          // while the reader asks macOS to Reduce transparency, and back on
          // when they stop: the setting can change while the app runs.
          if (navigator.platform.indexOf("Mac") === 0) {
            var reduce = window.matchMedia("(prefers-reduced-transparency: reduce)");
            var glass = function () { root.toggleAttribute("data-glass", !reduce.matches); };
            glass();
            reduce.addEventListener("change", glass);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
