<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>TerminalX nudge</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
  body { display: grid; place-items: center; pointer-events: none; color: #f8fafc; font-family: system-ui, sans-serif; }
  main {
    padding: 20px 28px;
    border: 1px solid #64748b;
    border-radius: 20px;
    background: #172033;
    box-shadow: 0 8px 28px #10182780;
    animation: nudge 3s ease both;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  @keyframes nudge {
    0%, 100% { opacity: 0; }
    10%, 86% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
<main><h1>A teammate nudged you</h1></main>
</html>
