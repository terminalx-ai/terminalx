name: Release desktop (Windows, Linux)

# Builds the Windows installer (NSIS) and the Linux packages (AppImage, deb,
# rpm) for a release, tests each one, and, when the release can be signed,
# attaches them and their update feeds to it.
#
# macOS releases are made by scripts/release/release.py, which publishes the
# DMG, its updater archive and latest.json, and checks that set byte for byte.
# Nothing here touches those files: Windows and Linux have feeds of their own,
# latest-windows.json and latest-linux.json (scripts/release/desktop-feed.py),
# which tauri.windows.conf.json and tauri.linux.conf.json point the updater at.
#
# It runs when a release is published (stable tags only), or by hand, where it
# only builds and tests unless `publish` is set for an existing release.
#
# Signing is optional, and each kind runs only when its secrets exist:
# - TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD): the updater signatures. Without
#   it nothing is published: an installed app only takes a signed update, so
#   the installers are kept as this run's artifacts instead.
# - WINDOWS_CERTIFICATE (a base64 PFX) and WINDOWS_CERTIFICATE_PASSWORD, with
#   the variable WINDOWS_TIMESTAMP_URL: Authenticode for the app, its
#   sidecars, the bundled runtime and the installer. Without them the
#   installer is unsigned and Windows says the publisher is unknown.
#
# The build job runs third-party build scripts with a read-only token and no
# GH_TOKEN. Only `publish` can write, and only to this repository's release.
# Linux builds on Ubuntu 22.04: glibc floor 2.35, as release-serve.yml.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z); empty builds the selected branch without publishing'
        required: false
        default: ''
      publish:
        description: 'Attach the signed installers and feeds to the release of that tag'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      sign_updater: ${{ steps.secrets.outputs.sign_updater }}
      sign_windows: ${{ steps.secrets.outputs.sign_windows }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          if [ "$EVENT" = release ]; then
            tag="$RELEASE_TAG"
            # Runtime and beta prereleases are not desktop releases.
            if [ "$RELEASE_PRERELEASE" = true ] || ! [[ "$tag" =~ $TAG_PATTERN ]]; then
              echo "::notice::$tag is not a stable desktop release; nothing to build."
              out ref ""; out tag ""; out publish false; exit 0
            fi
            publish=true
          else
            tag="$INPUT_TAG"
            publish="$INPUT_PUBLISH"
            if [ -n "$tag" ] && ! [[ "$tag" =~ $TAG_PATTERN ]]; then
              echo "::error::$tag is not a vX.Y.Z tag"; exit 1
            fi
            [ -n "$tag" ] || publish=false
          fi
          if [ "$publish" = true ]; then
            # Only a release that is out: a draft belongs to the macOS pipeline, which deletes what it did not put there.
            if ! gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
              echo "::warning::No published release $tag in $GH_REPO; building without publishing."
              publish=false
            fi
          fi
          out ref "${tag:-$GITHUB_SHA}"
          out tag "$tag"
          out publish "$publish"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.plan.outputs.ref != ''
        with:
          ref: ${{ steps.plan.outputs.ref }}
          persist-credentials: false
      # The three files that carry the version agree, and with the tag.
      - id: version
        if: steps.plan.outputs.ref != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          package=$(node -p 'require("./package.json").version')
          tauri=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$package" != "$tauri" ] || [ "$package" != "$cargo" ]; then
            echo "::error::package.json $package, tauri.conf.json $tauri, Cargo.toml $cargo"; exit 1
          fi
          if [ -n "$TAG" ] && [ "v$package" != "$TAG" ]; then
            echo "::error::$TAG does not match the version $package"; exit 1
          fi
          echo "version=$package" >> "$GITHUB_OUTPUT"
      # Whether each kind of signing can run. Only these booleans leave this step.
      - id: secrets
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && vars.WINDOWS_TIMESTAMP_URL != '' }}
        run: |
          echo "sign_updater=$HAS_UPDATER_KEY" >> "$GITHUB_OUTPUT"
          echo "sign_windows=$HAS_WINDOWS_CERTIFICATE" >> "$GITHUB_OUTPUT"
          echo "Updater signing: $HAS_UPDATER_KEY. Windows Authenticode: $HAS_WINDOWS_CERTIFICATE."

  build:
    needs: plan
    if: needs.plan.outputs.ref != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            os: windows-latest
            bundles: nsis
          - system: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows turns autocrlf on; the bundled scripts are kept as committed.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo infra/ci-runners/apt-mirrors.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake rpm file xdg-utils
      - name: Show the Rust toolchain
        run: rustup show && cargo --version
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      # The certificate goes into this user's store for the build only, and the
      # build is told its thumbprint: Tauri signs the app, its sidecars and the
      # installer, and scripts/build-local-runtime.mjs the bundled runtime.
      - name: Prepare Windows signing
        if: runner.os == 'Windows' && needs.plan.outputs.sign_windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'windows-signing.json') -Value $config -Encoding utf8
          "TERMINALX_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "TERMINALX_WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" >> $env:GITHUB_ENV
          "TERMINALX_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      # No updater artifacts here: they need the private key, which never
      # reaches this job. In Tauri 2 the installer itself is what the updater
      # downloads; `sign-updater` signs it.
      - name: Build the installers
        run: |
          set -euo pipefail
          signing=()
          if [ -f "$RUNNER_TEMP/windows-signing.json" ]; then signing=(--config "$RUNNER_TEMP/windows-signing.json"); fi
          pnpm tauri build --ci --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}' "${signing[@]}"
      - name: Collect the installers
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bundle"/nsis/*-setup.exe dist/
          else
            cp "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm dist/
          fi
          ls -l dist
      # Installed per user and removed again: every file the app needs is in
      # place, the terminalx:// scheme is registered, and nothing is left.
      - name: Install, check and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'TerminalX'
          $app = @('TerminalX.exe', 'raccoon.exe') | Where-Object { Test-Path (Join-Path $dir $_) } | Select-Object -First 1
          if (-not $app) { Get-ChildItem $dir -Recurse | Select-Object -First 40 FullName; throw "No app executable in $dir" }
          "App executable: $app"
          foreach ($file in @('agent-browser.exe', 'terminalx.cmd', 'tnx.cmd', 'local-runtime\terminalx-serve.exe', 'computer-use-windows\runtime.ps1', 'uninstall.exe')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Missing after install: $file" }
          }
          if (-not (Test-Path 'HKCU:\Software\Classes\terminalx')) { throw 'The terminalx:// scheme is not registered' }
          $help = & (Join-Path $dir 'local-runtime\terminalx-serve.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "The bundled runtime does not start ($LASTEXITCODE)" }
          $help | Select-Object -First 3
          # The uninstaller removes the CLI shims TerminalX wrote, and only those: one shim, one file of the same name that
          # is not TerminalX's.
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          [IO.File]::WriteAllText((Join-Path $bin 'terminalx.cmd'), "@echo off`r`nrem TerminalX CLI shim`r`nsetlocal DisableDelayedExpansion`r`n")
          [IO.File]::WriteAllText((Join-Path $bin 'tnx.cmd'), "@echo off`r`nrem someone else's tnx`r`n")
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself away and returns before it is done.
          foreach ($i in 1..60) { if (-not (Test-Path (Join-Path $dir $app))) { break }; Start-Sleep 1 }
          if (Test-Path (Join-Path $dir $app)) { throw 'The app is still installed after uninstalling' }
          if (Test-Path 'HKCU:\Software\Classes\terminalx') { throw 'The terminalx:// scheme is still registered after uninstalling' }
          if (Test-Path (Join-Path $bin 'terminalx.cmd')) { throw 'The TerminalX CLI shim is still there after uninstalling' }
          if (-not (Test-Path (Join-Path $bin 'tnx.cmd'))) { throw 'The uninstaller removed a tnx.cmd that was not TerminalX''s' }
      - name: Check the packages (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb); rpm=$(ls dist/*.rpm); appimage=$(ls dist/*.AppImage)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'local-runtime/terminalx-serve$'
          dpkg-deb --contents "$deb" | grep -E 'computer-use-linux/runtime\.py$'
          rpm -qpR "$rpm"
          rpm -qpl "$rpm" | grep -E 'local-runtime/terminalx-serve$'
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          runtime=$(find "$RUNNER_TEMP/squashfs-root" -path '*local-runtime/terminalx-serve' -type f | head -1)
          [ -n "$runtime" ] || { echo "::error::No runtime in the AppImage"; exit 1; }
          "$runtime" --help > "$RUNNER_TEMP/runtime-help.txt"
          head -3 "$RUNNER_TEMP/runtime-help.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.system }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The updater key signs the installers in one step of its own job, which runs
  # no build scripts. Each signature is checked against the committed public key.
  sign-updater:
    needs: [plan, build]
    if: needs.plan.outputs.sign_updater == 'true' && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for installer in dist/*-setup.exe dist/*.AppImage dist/*.deb dist/*.rpm; do
            pnpm tauri signer sign "$installer"
          done
      - name: Check the signatures against the app's public key
        run: |
          set -euo pipefail
          for installer in dist/*-setup.exe dist/*.AppImage dist/*.deb dist/*.rpm; do
            node scripts/release/verify-updater.mjs "$installer"
          done
      - name: Write the update feeds
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/release/desktop-feed.py --version "$VERSION" --repo "$GH_REPO" --dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-desktop
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, sign-updater]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-desktop-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-desktop
          path: dist
      # Installers and signatures first, the feeds last: an app reading a feed
      # finds everything it names already there.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          files=$(ls | grep -v '^latest-.*\.json$')
          gh release upload "$TAG" $files --clobber
          gh release upload "$TAG" latest-*.json --clobber
          echo "Attached to $TAG:"; ls
