name: WebKit layout checks on Linux

# The WebKit layout checks on Linux, in four parts on four runners. Not a
# required status and not part of CI's `check`: the required run is still
# `webkit-layout` on macOS (.github/workflows/ci.yml). This shows whether the
# checks pass on Linux and how long each part takes, so the macOS runner can be
# given up once they do (docs/CI-RUNNERS.md "macOS runner time").
#
# Nightly, by hand, and on a pull request that changes the checks or this
# file. It ran on every pull request at first: four jobs each, which waited
# in the same queue as the required ones (four runs of it among the 244 jobs
# of one busy hour) for a result nobody is held to yet.
#
# `run-all.mjs --shard i/4` deals every check to exactly one part. On Linux it
# leaves out the five it names in `macOnly`, each with its reason.
#
# Held to the same policy as CI by infra/ci-runners/test_workflow_security.py:
# read-only token, no secrets, actions pinned by commit, hosted runners only.
# No branch filter: it also runs for a pull request based on another branch.

on:
  pull_request:
    paths:
      - scripts/webkit/**
      - .github/workflows/webkit-linux.yml
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webkit-layout-linux:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm exec vite build
      - name: Install WebKit and the libraries it needs
        timeout-minutes: 10
        run: sudo infra/ci-runners/apt-mirrors.sh && pnpm exec playwright install --with-deps webkit
      - name: WebKit layout checks, this part of four
        run: node scripts/webkit/run-all.mjs --shard ${{ matrix.part }}/4
# Probe for the stop workflow; never merged.
