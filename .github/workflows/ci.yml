name: CI

# Required statuses stay check, frontend and webkit-layout. Every Linux job
# runs on Instabox (`instabox-medium`: a fresh machine for each job), pull
# requests included; the macOS jobs stay GitHub-hosted. What that means for a
# public repository is in docs/CI-RUNNERS.md "Threat model".
#
# macOS runners are the scarce ones: a handful run at once for the whole
# account, and a job that needs one waits behind every other. webkit-layout
# needs one on every run; macos-native and machine-compat take one only when
# `macos-rust-changes` selects them (docs/CI-RUNNERS.md "macOS runner time").
# Everything else runs on Linux, the long suites in parts on several runners.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Supersede older PR runs. Give each main/nightly/manual run its own group:
# GitHub otherwise replaces pending runs after rapid merges, even with
# cancel-in-progress disabled. Every push to main must run the macOS suite.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # PR writes stay isolated; restores may fall back to public, trusted main caches.
  # A cargo cache holds the built dependencies, so its key is the lock file and
  # the compiler, not the commit: this crate is rebuilt on every checkout
  # whatever is restored. A job saves one only when nothing was restored, so
  # main keeps one cache per job and a pull request writes its own only when it
  # changes the lock file. Keyed by commit, every run saved a new one and the
  # repository's 10 GB evicted them before the next run could use them.
  CI_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'main') || format('run-{0}', github.run_id) }}

jobs:
  # The diagnostic's tests set the operating system themselves
  # (platform.system is patched to Linux and to Darwin), so one runner covers
  # both: a macOS leg waited hours for a runner to repeat twelve seconds of it.
  legacy-runtime-probe:
    strategy:
      matrix:
        os: [instabox-medium]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test legacy AppImage diagnostic
        run: python3 scripts/linux-runtime-probe.test.py

  frontend:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc --noEmit
      - name: tsc (phone app)
        run: pnpm --dir mobile exec tsc --noEmit
      - name: Build the frontend
        run: pnpm build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify portable source icons and CI policy
        run: |
          python3 -m pip install Pillow==11.1.0 PyYAML==6.0.2
          python3 scripts/test_icons.py
          python3 -m unittest discover -s infra/ci-runners -p 'test_*.py'

  # The whole Vitest suite, in four parts on four runners: `--shard` deals
  # every test file to exactly one part, so together they are `pnpm vitest run`.
  vitest:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Install shells used by the tests
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: vitest
        run: pnpm vitest run --shard=${{ matrix.part }}/4

  # On macOS, on every run. On Linux 40 of the 107 checks fail for reasons that
  # are Linux's, not the app's: the fixtures use macOS paths (/private/...),
  # the app shows Ctrl where the checks read ⌘, and a third time out
  # (docs/CI-RUNNERS.md "macOS runner time").
  webkit-layout:
    runs-on: macos-latest
    # The layout checks alone take about 30 minutes on a hosted runner, and the machine
    # screens another 3: at 35 the job was cancelled on runs where every check had passed.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      # Layout checks that jsdom cannot make: the built app in WebKit, measured.
      - name: Build the frontend
        run: pnpm build
      - name: Install WebKit for the layout checks
        run: pnpm exec playwright install webkit
      # scripts/webkit/run-all.mjs runs them several at once, permission-details among them.
      - name: WebKit layout checks
        run: pnpm test:webkit-layout
        # The machine checks among them also keep their pictures (PRO-360).
        env:
          MACHINE_SIDEBAR_SHOTS: scripts/webkit/output/machines-screens/machine-sidebar
          MACHINE_SESSION_SHOTS: scripts/webkit/output/machines-screens/machine-session
          MACHINE_PORTS_SHOTS: scripts/webkit/output/machines-screens/machine-ports
      # Every other 21.xx screen, from the built app, for review beside the
      # designs (PRO-360): pairing (21.04 to 21.06), connection states (21.09),
      # the machine page and adding a project (21.10, 21.11) and updates. These
      # A failure in these scripts fails the job, like the other required steps.
      - name: Shoot the other machine screens
        timeout-minutes: 8
        run: |
          status=0
          for name in machines-pairing machine-connection machine-page machine-update; do
            mkdir -p "scripts/webkit/output/machines-screens/$name"
            MACHINES_SHOTS="scripts/webkit/output/machines-screens/$name" node "scripts/webkit/$name.mjs" || status=1
          done
          exit $status
      # The machine screens the WebKit fixture shoots against two machines
      # (PRO-358, scripts/webkit/machines-screens.mjs), and the ones above, kept for review.
      - name: Upload the machine screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: machine-screens
          path: scripts/webkit/output/machines-screens
          if-no-files-found: error

  linux-rust:
    # The larger machine: these jobs compile the desktop crate (docs/CI-RUNNERS.md).
    runs-on: instabox-large
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake zsh ripgrep
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies and build the frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && cargo clippy --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-linux-rust-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-linux-rust-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Save the cargo cache
        if: steps.cargo-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The full desktop suite, `cargo test --locked`, in three parts on three
  # runners. The tests wait on processes and terminals more than they compute,
  # and two thirds of the time is under `session::` and `remote::`.
  #
  # The parts are exact. A filter matches any test whose name contains it:
  # `prompts` runs the names containing its filter, `session-remote` the names
  # containing `session::` or `remote::` except those, and `rest` every name
  # containing neither, then the other test binaries and the doc tests. A
  # renamed module changes which runner a test is on, never whether it runs.
  # infra/ci-runners/test_workflow_security.py holds these three to that shape.
  linux-rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: prompts
            tests: "session::watch_tests::prompts"
          - part: session-remote
            tests: "session:: remote:: --skip session::watch_tests::prompts"
          - part: rest
            tests: "--skip session:: --skip remote::"
    # The larger machine: these jobs compile the desktop crate (docs/CI-RUNNERS.md).
    runs-on: instabox-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake zsh ripgrep
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies and build the frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-linux-rust-tests-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-linux-rust-tests-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      # No separate build step: the first compile after the frontend build
      # writes the embedded assets and the next cargo command compiles the
      # crate again, three minutes on each runner.
      - name: cargo test (this part of the library's tests)
        working-directory: src-tauri
        run: cargo test --locked --lib -- ${{ matrix.tests }}
      - name: cargo test (the other test binaries and the doc tests)
        if: matrix.part == 'rest'
        working-directory: src-tauri
        run: |
          cargo test --locked --bins --test '*'
          cargo test --locked --doc
      # `rest` builds everything the other two do and more, so it alone saves:
      # also when a test failed, as long as the library's tests were built.
      - name: Note whether the library's tests were built
        id: built
        if: ${{ !cancelled() && matrix.part == 'rest' }}
        run: |
          if [ -n "$(find src-tauri/target/debug -type f -perm -u+x -name 'raccoon_lib-*' -print -quit)" ]; then
            echo 'tests=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.built.outputs.tests == 'true' && steps.cargo-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos-rust-changes:
    runs-on: instabox-medium
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      machines: ${{ steps.machines.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select macOS Rust coverage
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 infra/ci-runners/macos-rust.py --base "$PR_BASE" --head "$PR_HEAD"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      # machine-compat needs a macOS runner too; it runs for the changes
      # machines-e2e runs for (scripts/machine-e2e/relevant.py).
      - name: Select the machine compatibility matrix
        id: machines
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-e2e/relevant.py

  # Runs when the selector asks for it: every push to main, nightly, manual
  # runs, and a pull request that touches code macOS builds differently.
  # Skipped otherwise, and `check` accepts that skip from the selector alone.
  #
  # Pushes to main share one group: while one runs, only the newest waiting
  # commit keeps its place, and an older one still waiting is cancelled (its
  # `check` fails). Merges land in bursts and each run is long; a commit
  # already superseded does not need the runner more than the newest one does.
  macos-native:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.required == 'true'
    concurrency:
      group: ci-macos-native-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify source and compiled app icons
        run: |
          python3 -m pip install Pillow==11.1.0
          python3 scripts/test_icons.py
          python3 scripts/test_packaged_icons.py
          python3 scripts/test_compiled_icons.py

      - name: Install ripgrep for the Rust security tests
        run: brew install ripgrep

      # rust-toolchain.toml decides the channel and pulls in clippy.
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && cargo clippy --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-macos-native-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-macos-native-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}

      # tauri-build packages the frontend output into the Rust build.
      - name: Build the frontend
        run: pnpm build

      # The computer-use helper is a Swift package with its own unit tests.
      # It is built before the Rust checks so tauri-build packages a real
      # helper rather than the empty stand-in build.rs creates.
      - name: swift test (computer-use helper)
        run: swift test --package-path native/computer-use-macos

      - name: build the computer-use helper app
        run: node scripts/build-computer-macos.mjs

      # One compiler working on this crate holds over 5 GB, and this runner has
      # 7 GB. --all-targets and a full cargo test each start two at once (the
      # library and its test build) and the runner swaps. Each pair of steps
      # below does the same work one compiler at a time: the second step builds
      # only what the first did not. The first clippy step names an integration
      # test because that checks the library as --all-targets will, with the
      # test-only dependency features on.
      #
      # clippy stays ahead of the tests. The first compile after the frontend
      # changes writes the embedded assets, and the next cargo command then
      # repeats that one compile: here that is a one-minute check, not the
      # library's test build.
      - name: clippy (the library by itself)
        working-directory: src-tauri
        run: cargo clippy --locked --test serde_field_naming -- -D warnings

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: build the library's tests by themselves
        id: build
        if: needs.macos-rust-changes.outputs.required == 'true'
        working-directory: src-tauri
        run: cargo test --locked --lib --no-run

      - name: cargo test (full macOS suite when selected)
        if: needs.macos-rust-changes.outputs.required == 'true'
        working-directory: src-tauri
        run: cargo test --locked

      # Also when a test failed, as long as the build was whole: a suite that
      # fails must not leave every later run to build the dependencies again.
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The headless runtime a cloud workspace boots. The runner has no WebView,
  # GTK or ALSA development packages, so a GUI dependency fails the build.
  headless-serve:
    runs-on: instabox-medium
    timeout-minutes: 30
    env:
      # The tests build unoptimised ([profile.test]). Build the binary the
      # same way, so they reuse its library instead of compiling it twice.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-headless-serve-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-headless-serve-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      - name: Build terminalx-serve
        id: build
        working-directory: src-tauri/serve
        run: cargo build --locked --bin terminalx-serve
      - name: No GUI crates in its dependency tree
        working-directory: src-tauri/serve
        run: |
          cargo tree --locked -e normal,build > "$RUNNER_TEMP/serve-tree.txt"
          ! grep -E '(^|[^a-z])(tauri|wry|webkit2gtk|gtk|cpal|alsa-sys)[ -]' "$RUNNER_TEMP/serve-tree.txt"
      - name: Clippy
        working-directory: src-tauri/serve
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Owner hook round trip and lost-transport denial
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test owner_pretool
          cargo test --locked --test local_lifetime owner_hook_process_fails_closed_when_its_socket_disappears
      - name: Replacing an older runtime with the bundled one (#730)
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test local_lifetime a_runtime_names_what_stopping_it_would_cut_short_and_stops_by_itself_only_without_any
          cargo test --locked --test local_lifetime a_runtime_says_its_build_and_turns_and_a_retired_one_is_replaced_by_the_next_launch
      - name: Handing the runtime over without stopping what it runs (#765)
        working-directory: src-tauri/serve
        run: cargo test --locked --test local_handover
      - name: CLI issue starts in the shipped runtime (#786)
        working-directory: src-tauri/serve
        run: cargo test --locked --features local-ui --test local_issue_start
      - name: A lead lists and stops the sessions it started (PRO-270)
        working-directory: src-tauri/serve
        run: cargo test --locked --test session_parent
      - name: A headless runtime lets a paired computer operate it (PRO-341)
        working-directory: src-tauri/serve
        run: cargo test --locked --test machine_host
      - name: A person pairs from a headless server's terminal; an update hands the runtime over (PRO-353)
        working-directory: src-tauri/serve
        run: cargo test --locked --test headless_pair --test headless_update
      - name: Self-test (start, shell PTY, clean exit)
        working-directory: src-tauri/serve
        run: ../target/debug/terminalx-serve --data-dir "$RUNNER_TEMP/serve" --project-root "$GITHUB_WORKSPACE" --runtime-kind cloud-workspace --self-test
      - name: Self-test under the cloud workspace unit's sandbox (ProtectHome, own user)
        run: bash scripts/remote-runtime/cloud-unit-self-test.sh src-tauri/target/debug/terminalx-serve
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # PRO-354: this build against the previous two released runtimes, both
  # ways (docs/MACHINES.md "Versions and updates"). The released runtimes
  # ship only inside the macOS app, so this runs on macOS. The test build is
  # the headless runtime's (no desktop features), which macos-native does
  # not build, so the job keeps its own cache.
  #
  # Selected like machines-e2e (every push, schedule and dispatch; a pull
  # request that touches the machines), and on main only the newest waiting
  # commit keeps its place, as macos-native.
  machine-compat:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.machines == 'true'
    concurrency:
      group: ci-machine-compat-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # As headless-serve: the binary and the tests share one library build.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-machine-compat-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-machine-compat-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      # The two newest v* releases before this build's version, each
      # archive checked against its SHA256SUMS before the runtime comes out.
      - name: Fetch and verify the previous two released runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-compat/fetch_releases.py --out "$RUNNER_TEMP/machine-compat"
      - name: Build the compatibility matrix
        id: build
        working-directory: src-tauri/serve
        run: cargo test --locked --test machine_compat --no-run
      - name: This build against the previous two runtimes
        working-directory: src-tauri/serve
        env:
          TERMINALX_MACHINE_COMPAT: ${{ runner.temp }}/machine-compat/manifest.json
        run: cargo test --locked --test machine_compat -- --test-threads=1
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # PRO-358: two machines end to end. The desktop's own pairing client and
  # machine supervisor against two runtimes in their own processes, "Mac
  # mini" on this runner and "dev-server" in a Linux container, beside the
  # operating computer's own runtime (tests/machines_e2e.rs, built and run by
  # scripts/machine-e2e/run.py), and the machine routes through a relay in
  # the test (tests/machine_routes.rs). `check` fails on a skipped job, so this
  # always runs and decides in a step: every push, schedule and dispatch, and
  # a pull request that touches the machines (scripts/machine-e2e/relevant.py).
  # A pull request gets ten minutes; main gets more, so a cold cache can be
  # built and saved there for pull requests to restore. Previous-release
  # compatibility is machine-compat (PRO-354), not this.
  # .github/workflows/machines-e2e-breaks.yml proves a deliberate break in
  # the pairing check or the project scoping fails these scenarios.
  machines-e2e:
    runs-on: instabox-medium
    # The ten-minute budget is checked at the end, for a run with a warm
    # cache; a cold one (the first after a Cargo.lock change) gets room to
    # build and save one.
    timeout-minutes: 25
    env:
      # As headless-serve: the binary and the tests share one library build.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      # The dev-server container must run here: its absence fails the tests.
      TERMINALX_E2E_REQUIRE_LINUX: "1"
    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge commit and its base, for relevant.py's fallback.
          fetch-depth: 2
      - name: Does this change touch the machines?
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-e2e/relevant.py
      - name: Show the Rust toolchain
        if: steps.relevant.outputs.run == 'true'
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        if: steps.relevant.outputs.run == 'true'
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-machines-e2e-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-machines-e2e-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      - name: Two machines end to end (machines_e2e, machine_routes), timed
        if: steps.relevant.outputs.run == 'true'
        run: python3 -I scripts/machine-e2e/run.py tests machines_e2e machine_routes
      - name: The job's run time, against its ten minutes
        if: always() && steps.relevant.outputs.run == 'true'
        env:
          WARM: ${{ steps.cargo-cache.outputs.cache-matched-key != '' }}
        run: |
          seconds=$(( $(date +%s) - JOB_STARTED ))
          line="machines-e2e took $((seconds / 60)) min $((seconds % 60)) s (cache: $([ "$WARM" = true ] && echo warm || echo cold))"
          echo "$line"
          echo "**$line**; the budget is 10 min with a warm cache." >> "$GITHUB_STEP_SUMMARY"
          if [ "$WARM" = true ] && [ "$seconds" -gt 600 ]; then
            echo "::error::machines-e2e took over ten minutes with a warm cache"
            exit 1
          fi
      # Saved from main, schedule and dispatch runs only: uploading the
      # target directory would eat a pull request's ten minutes.
      - name: Save the cargo cache
        if: steps.relevant.outputs.run == 'true' && github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  desktop-platforms:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is off until a Windows runner is set up: the job never
        # got a runner and left every run unfinished. Add it back here; the
        # Windows-only steps below are still in place.
        os: [instabox-medium]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v4-desktop-platforms-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
          restore-keys: |
            ci-v4-desktop-platforms-main-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ steps.toolchain.outputs.rustc }}
      - name: Build frontend and verify off-macOS helper build is a no-op
        run: pnpm build:computer-macos && pnpm build
      # On Linux, linux-rust already checks every target (clippy) and runs
      # these tests in its full suite, and frontend runs every script test:
      # the three steps marked "not Linux" are for the other platforms.
      - name: Platform build
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Computer contract tests
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: "cargo test --lib computer::"
      # The local owner path needs no macOS APIs; reuse Linux's build setup.
      - name: Local issue starts without desktop features (#786)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --no-default-features --features local-ui --lib control::issue_tests
      - name: Windows process exit observation
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib process_probe_distinguishes_running_from_confirmed_exit
      - name: Windows pipe tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: "cargo test --lib pipe_transport::"
      - name: Windows control and hook integration
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib named_pipe_serves_authenticated_control_and_hook_frames
      - name: Desktop script input safety tests
        if: runner.os != 'Linux'
        run: pnpm vitest run scripts/computer-use-modifier-safety.test.mjs scripts/computer-use-mouse-button-routing.test.mjs scripts/computer-use-windows-horizontal-scroll.test.mjs
      - name: Linux render tests
        if: runner.os == 'Linux'
        run: |
          python3 native/computer-use-linux/runtime_render_test.py
          python3 native/computer-use-linux/launcher_test.py
      - name: Windows render tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./native/computer-use-windows/runtime-render.test.ps1
      - name: Windows render tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/computer-use-windows/runtime-render.test.ps1
      - name: Save the cargo cache
        if: steps.cargo-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  check:
    # Keep the exact required status and fail closed on failed/cancelled/skipped jobs.
    if: always()
    needs: [frontend, vitest, webkit-layout, linux-rust, linux-rust-tests, macos-rust-changes, macos-native, headless-serve, machine-compat, machines-e2e, desktop-platforms, legacy-runtime-probe]
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      # Every job must succeed. The two macOS jobs alone may be skipped, and
      # only when the selector, which must itself succeed, said this change
      # does not need them: any other skip is a job that did not run.
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .["macos-rust-changes"] as $selector
            | $selector.result == "success"
              and ([to_entries[] | .key as $job | .value.result
                    | . == "success"
                      or (. == "skipped"
                          and (($job == "macos-native" and $selector.outputs.required == "false")
                            or ($job == "machine-compat" and $selector.outputs.machines == "false")))]
                   | all)'
