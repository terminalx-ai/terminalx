name: CI

# Portable checks run in parallel with Apple-only checks. `check` remains
# the required aggregate status; see docs/CI-RUNNERS.md for coverage and rollout.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Supersede older PR runs. Give each main/nightly/manual run its own group:
# GitHub otherwise replaces pending runs after rapid merges, even with
# cancel-in-progress disabled. Every push to main must run the macOS suite.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  legacy-runtime-probe:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test legacy AppImage diagnostic
        run: python3 scripts/linux-runtime-probe.test.py

  linux-frontend:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc --noEmit
      - name: tsc (phone app)
        run: pnpm --dir mobile exec tsc --noEmit
      - name: vitest
        run: pnpm vitest run
      - name: Build the frontend
        run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable source icons
        run: |
          python3 -m pip install Pillow==11.1.0
          python3 scripts/test_icons.py
      - name: Test the macOS Rust coverage selector and timing report
        run: python3 -m unittest discover -s infra/ci-runners -p 'test_*.py'

  linux-rust:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake
      - name: Show the Rust toolchain
        run: rustup show && cargo --version && cargo clippy --version
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: linux-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-tests-${{ runner.os }}-${{ runner.arch }}-
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (full desktop suite)
        working-directory: src-tauri
        run: cargo test --locked
      - name: Save the cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source and compiled app icons
        run: |
          python3 -m pip install Pillow==11.1.0
          python3 scripts/test_icons.py
          python3 scripts/test_packaged_icons.py
          python3 scripts/test_compiled_icons.py

      # rust-toolchain.toml decides the channel and pulls in clippy.
      - name: Show the Rust toolchain
        run: rustup show && cargo --version && cargo clippy --version

      # Restored everywhere, saved only from main. Avoid retaining a separate
      # multi-gigabyte Cargo build cache for every pull request.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: macos-clippy-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-clippy-${{ runner.os }}-

      # Layout checks that jsdom cannot make: the built app in WebKit, measured.
      - name: Build the frontend
        run: pnpm build

      - name: Install WebKit for the layout checks
        run: pnpm exec playwright install webkit

      - name: WebKit layout checks
        run: |
          pnpm test:webkit-layout
          node scripts/webkit/permission-details.mjs

      # The computer-use helper is a Swift package with its own unit tests.
      # It is built before the Rust checks so tauri-build packages a real
      # helper rather than the empty stand-in build.rs creates.
      - name: swift test (computer-use helper)
        run: swift test --package-path native/computer-use-macos

      - name: build the computer-use helper app
        run: node scripts/build-computer-macos.mjs

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Save the cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos-rust-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select macOS Rust coverage
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 infra/ci-runners/macos-rust.py --base "$PR_BASE" --head "$PR_HEAD"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  macos-rust:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.required == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Show the Rust toolchain
        run: rustup show && cargo --version
      - name: Build the computer-use helper app
        run: node scripts/build-computer-macos.mjs
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test (full macOS suite)
        working-directory: src-tauri
        run: cargo test --locked
      - name: Save the cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Keep the existing required status and fail closed on a cancelled/failed
  # dependency. Only the intentionally unselected macOS suite may be skipped.
  check:
    if: always()
    needs: [linux-frontend, linux-rust, macos, macos-rust-changes, macos-rust, legacy-runtime-probe, headless-serve, desktop-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          for name, job in needs.items():
              expected = 'success'
              if name == 'macos-rust' and needs['macos-rust-changes']['outputs'].get('required') == 'false':
                  expected = 'skipped'
              if job['result'] != expected:
                  raise SystemExit(f"{name}: {job['result']} (expected {expected})")
          PY

  # The headless runtime a cloud workspace boots. The runner has no WebView,
  # GTK or ALSA development packages, so a GUI dependency fails the build.
  headless-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: serve-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: serve-cargo-${{ runner.os }}-
      - name: Build terminalx-serve
        working-directory: src-tauri/serve
        run: cargo build --locked --bin terminalx-serve
      - name: No GUI crates in its dependency tree
        working-directory: src-tauri/serve
        run: |
          cargo tree --locked -e normal,build > "$RUNNER_TEMP/serve-tree.txt"
          ! grep -E '(^|[^a-z])(tauri|wry|webkit2gtk|gtk|cpal|alsa-sys)[ -]' "$RUNNER_TEMP/serve-tree.txt"
      - name: Clippy
        working-directory: src-tauri/serve
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Owner hook round trip and lost-transport denial
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test owner_pretool
          cargo test --locked --test local_lifetime owner_hook_process_fails_closed_when_its_socket_disappears
      - name: Replacing an older runtime with the bundled one (#730)
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test local_lifetime a_runtime_names_what_stopping_it_would_cut_short_and_stops_by_itself_only_without_any
          cargo test --locked --test local_lifetime a_runtime_says_its_build_and_turns_and_a_retired_one_is_replaced_by_the_next_launch
      - name: Handing the runtime over without stopping what it runs (#765)
        working-directory: src-tauri/serve
        run: cargo test --locked --test local_handover
      - name: Self-test (start, shell PTY, clean exit)
        working-directory: src-tauri/serve
        run: ../target/debug/terminalx-serve --data-dir "$RUNNER_TEMP/serve" --project-root "$GITHUB_WORKSPACE" --runtime-kind cloud-workspace --self-test

  desktop-platforms:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is off until a Windows runner is set up: the job never
        # got a runner and left every run unfinished. Add it back here; the
        # Windows-only steps below are still in place.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ runner.os }}-
      - name: Build frontend and verify off-macOS helper build is a no-op
        run: pnpm build:computer-macos && pnpm build
      - name: Platform build
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Computer contract tests
        working-directory: src-tauri
        run: "cargo test --lib computer::"
      - name: Windows process exit observation
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib process_probe_distinguishes_running_from_confirmed_exit
      - name: Windows pipe tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: "cargo test --lib pipe_transport::"
      - name: Windows control and hook integration
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib named_pipe_serves_authenticated_control_and_hook_frames
      - name: Desktop script input safety tests
        run: pnpm vitest run scripts/computer-use-modifier-safety.test.mjs scripts/computer-use-mouse-button-routing.test.mjs scripts/computer-use-windows-horizontal-scroll.test.mjs
      - name: Linux render tests
        if: runner.os == 'Linux'
        run: |
          python3 native/computer-use-linux/runtime_render_test.py
          python3 native/computer-use-linux/launcher_test.py
      - name: Windows render tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./native/computer-use-windows/runtime-render.test.ps1
      - name: Windows render tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/computer-use-windows/runtime-render.test.ps1
