name: CI

# Required statuses stay check, frontend and webkit-layout. All PR work is
# GitHub-hosted; only protected main runs may opt into the owner-managed pool.
# YAML is not a runner access boundary: see docs/CI-RUNNERS.md before enabling it.
#
# macOS runners are the scarce ones: a handful run at once for the whole
# account, and a job that needs one waits behind every other. macos-native,
# machine-compat and webkit-mac-only take one only when `macos-rust-changes`
# selects them (docs/CI-RUNNERS.md "macOS runner time"). Everything else runs
# on Linux, the long suites in parts, the WebKit layout checks among them.
#
# A pull request runs the jobs its changes need: `macos-rust-changes` answers
# for the Rust jobs, the frontend jobs, the phone app and macOS, and `check`
# accepts a skipped job only on that answer (docs/CI-RUNNERS.md "What a pull
# request runs"). Pushes to main, nightly and manual runs run everything.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Supersede older PR runs. Give each main/nightly/manual run its own group:
# GitHub otherwise replaces pending runs after rapid merges, even with
# cancel-in-progress disabled. Every push to main must run the macOS suite.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # PR writes stay isolated; restores may fall back to public, trusted main caches.
  # A cargo cache holds the built dependencies and nothing of this crate, which
  # is rebuilt on every checkout whatever is restored. Its key is the compiler
  # and then the lock file, not the commit. A run restores its own scope's, else
  # main's for the same lock file, else main's newest for the same compiler: a
  # changed lock file rebuilds the crates that changed, not all of them. A job
  # saves only when what it restored was not built from its lock file, so main
  # keeps one cache per job and lock file, and a pull request writes its own
  # only when it changes the lock file.
  CI_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'main') || format('run-{0}', github.run_id) }}

jobs:
  # The diagnostic's tests set the operating system themselves
  # (platform.system is patched to Linux and to Darwin), so one runner covers
  # both: a macOS leg waited hours for a runner to repeat twelve seconds of it.
  legacy-runtime-probe:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test legacy AppImage diagnostic
        run: python3 scripts/linux-runtime-probe.test.py

  # Never skipped: the icon check and the CI policy and selector tests run
  # whatever a pull request changes. The TypeScript check and the build run
  # when the frontend changed. This is the one place `tsc` runs: every other
  # job that needs the built frontend runs `vite build` alone.
  frontend:
    needs: macos-rust-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      # On every pull request. These need Python and the Node of .nvmrc, no
      # packages: the policy tests ask scripts/webkit/run-all.mjs which checks
      # each WebKit job runs.
      - name: Verify the CI policy
        run: |
          python3 -m pip install Pillow==11.1.0 PyYAML==6.0.2
          python3 -m unittest discover -s infra/ci-runners -p 'test_*.py'
      # The icon check asks Expo for the phone app's configuration (`pnpm exec
      # expo config`), so the packages are installed on every pull request too.
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify portable source icons
        run: python3 scripts/test_icons.py
      - name: tsc
        if: needs.macos-rust-changes.outputs.frontend == 'true'
        run: pnpm exec tsc --noEmit
      - name: Build the frontend
        if: needs.macos-rust-changes.outputs.frontend == 'true'
        run: pnpm exec vite build

  # The phone app's own type check and tests (`mobile/`), when it, the package
  # it shares with the desktop or the desktop types it imports changed.
  phone-app:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.phone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc (phone app)
        run: pnpm --dir mobile exec tsc --noEmit
      - name: vitest (phone app)
        run: pnpm --dir mobile test

  # The whole Vitest suite, in four parts on four runners: `--shard` deals
  # every test file to exactly one part, so together they are `pnpm vitest run`.
  vitest:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      # The hosted image's published software list names no zsh, so it is
      # installed: once, with retries and a time limit.
      # No limit of its own: the job's bounds it (a slow mirror trips neither the
      # stall option nor a retry).
      - name: Install shells used by the tests
        run: sudo infra/ci-runners/apt-mirrors.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y zsh && command -v zsh
      - name: vitest
        run: pnpm vitest run --shard=${{ matrix.part }}/4

  # The WebKit layout checks on Linux, whenever the frontend changed, in four
  # parts on four runners: `run-all.mjs --shard i/4` deals every check to
  # exactly one part, and on Linux leaves out the ones in its `macOnly` list
  # (each with its reason), which `webkit-mac-only` runs. A part takes 4 to 10
  # minutes; the whole suite on the three-core macOS runner took 30 to 37.
  webkit-layout-linux:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      # Layout checks that jsdom cannot make: the built app in WebKit, measured.
      # `frontend` runs tsc; this needs only the built app.
      - name: Build the frontend
        run: pnpm exec vite build
      - name: Install WebKit and the libraries it needs
        timeout-minutes: 10
        run: sudo infra/ci-runners/apt-mirrors.sh && pnpm exec playwright install --with-deps webkit
      - name: WebKit layout checks, this part of four
        run: node scripts/webkit/run-all.mjs --shard ${{ matrix.part }}/4
        # The machine checks among them also keep their pictures (PRO-360).
        env:
          MACHINE_SIDEBAR_SHOTS: scripts/webkit/output/machines-screens/machine-sidebar
          MACHINE_SESSION_SHOTS: scripts/webkit/output/machines-screens/machine-session
          MACHINE_PORTS_SHOTS: scripts/webkit/output/machines-screens/machine-ports
      # Each part keeps the machine screens of the checks it ran; webkit-layout
      # puts them together as one artifact, and fails when there are none.
      - name: Upload this part's machine screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: machine-screens-${{ matrix.part }}
          path: scripts/webkit/output/machines-screens
          if-no-files-found: ignore

  # The required status `webkit-layout` (branch protection names it), on Linux
  # and on every pull request: it passes only when every Linux part succeeded,
  # or when all were skipped because the selector, which succeeded, answered
  # "false" for the frontend. A part failed or cancelled fails it. It then keeps
  # the machine screens (PRO-358, scripts/webkit/machines-screens.mjs, and every
  # other 21.xx screen) as one artifact, for review beside the designs.
  webkit-layout:
    if: always()
    needs: [macos-rust-changes, webkit-layout-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every Linux part to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .["macos-rust-changes"] as $selector
            | .["webkit-layout-linux"].result as $parts
            | $selector.result == "success"
              and ($parts == "success"
                   or ($parts == "skipped" and $selector.outputs.frontend == "false"))'
      - name: Gather the machine screens
        if: needs.webkit-layout-linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: machine-screens-*
          merge-multiple: true
          path: machine-screens
      - name: Upload the machine screens
        if: needs.webkit-layout-linux.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: machine-screens
          path: machine-screens
          if-no-files-found: error

  # The WebKit checks a Linux runner cannot make (run-all.mjs `macOnly`, each
  # with its reason), on macOS: every push to main, nightly, manual runs, and a
  # pull request only when the selector's `mac-webkit` answer is "true": one
  # that changes a mac-only check, what it loads, or the product it renders
  # (docs/CI-RUNNERS.md "macOS runner time"). A mac-only check broken by any
  # other pull request is found on main.
  #
  # `check` does not wait for it (the owner's decision, 24 November 2026): on
  # a pull request it shows its own result without holding the merge. Every
  # other run is held to it by `check-macos`.
  webkit-mac-only:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.mac-webkit == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm exec vite build
      - name: Install WebKit for the layout checks
        run: pnpm exec playwright install webkit
      - name: WebKit layout checks that need macOS
        run: node scripts/webkit/run-all.mjs --only mac-only

  linux-rust:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.rust == 'true'
    runs-on: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # This detects image mistakes; the owner must enforce isolation before registration.
      - name: Verify the self-hosted image is unprivileged
        if: runner.environment == 'self-hosted'
        run: |
          test "$(id -u)" -ne 0
          if sudo -n true 2>/dev/null; then
            echo 'Runner user must not have passwordless sudo' >&2
            exit 1
          fi
          test ! -S /var/run/docker.sock
          test ! -S /run/podman/podman.sock
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No limit of its own: the job's bounds it. A mirror that serves every
      # small file slowly trips neither the stall option nor a retry, and a ten
      # minute limit here failed three parts of one run while the same step
      # took 25 s in its other jobs.
      - name: Install Linux build dependencies
        if: runner.environment == 'github-hosted'
        run: sudo infra/ci-runners/apt-mirrors.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake zsh ripgrep
      # tauri-build needs the folder the frontend builds into; no Rust test
      # reads what is in it, so these jobs do not install or build the frontend.
      - name: Stand in for the frontend build
        run: mkdir -p dist && printf '<!doctype html><title>TerminalX</title>\n' > dist/index.html
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && cargo clippy --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-linux-rust-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-linux-rust-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-linux-rust-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The full desktop suite in five parts on five runners.
  #
  # Parts 1 to 4 are the library's tests under cargo-nextest, which runs each
  # test in a process of its own: about 2,000 of them take a lock that is one
  # per process (`store::temp_home`), and under `cargo test` they queued behind
  # each other. `--partition count:i/4` deals every test to exactly one part, by
  # its place in the sorted list, so a new or renamed test changes which runner
  # a test is on and never whether it runs. The `ci` profile
  # (src-tauri/.config/nextest.toml) retries only the known flaky tests it names,
  # each with its ticket, and writes a JUnit file, which is kept.
  #
  # `binaries` is the rest of `cargo test --locked`: the other test binaries and
  # the doc tests, then the local owner path built without the desktop features.
  # infra/ci-runners/test_workflow_security.py holds the five to that shape.
  linux-rust-tests:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No limit of its own, as in linux-rust: the job's bounds it.
      - name: Install Linux build dependencies
        run: sudo infra/ci-runners/apt-mirrors.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf clang cmake zsh ripgrep
      # tauri-build needs the folder the frontend builds into; no Rust test
      # reads what is in it, so these jobs do not install or build the frontend.
      - name: Stand in for the frontend build
        run: mkdir -p dist && printf '<!doctype html><title>TerminalX</title>\n' > dist/index.html
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      # One release, by version and by the SHA-256 of its archive.
      - name: Install cargo-nextest
        if: matrix.part != 'binaries'
        env:
          NEXTEST_VERSION: "0.9.152"
          NEXTEST_SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/nextest.tar.gz" "https://get.nexte.st/$NEXTEST_VERSION/x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-linux-rust-tests-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-linux-rust-tests-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-linux-rust-tests-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      - name: The library's tests, this part of four
        if: matrix.part != 'binaries'
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo nextest run --locked --lib --profile ci --partition count:${{ matrix.part }}/4 2>&1 | tee "$RUNNER_TEMP/nextest.log"
      # A flaky test passed on a retry its override allows; a leaky one left a
      # process or a pipe open. Neither fails the run, so both are said here.
      - name: Name the flaky and leaky tests in the summary
        if: ${{ !cancelled() && matrix.part != 'binaries' }}
        run: |
          {
            echo "### Flaky and leaky tests, part ${{ matrix.part }}"
            echo '```'
            grep -aE '^[[:space:]]*(FLAKY|LEAK)[[:space:]]' "$RUNNER_TEMP/nextest.log" | sort -u || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the JUnit report
        if: ${{ !cancelled() && matrix.part != 'binaries' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-junit-${{ matrix.part }}
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: warn
      # Built once, as macos-native builds the library's tests: without the
      # OUT_DIR dates put back, the test step below compiled the crate again
      # (190 s in run 45442275413). The script fails unless a second
      # `--no-run` finds every unit fresh.
      - name: Build the other test binaries
        id: build
        if: matrix.part == 'binaries'
        working-directory: src-tauri
        run: ../infra/ci-runners/cargo-build-once.sh --bins --test '*'
      - name: cargo test (the other test binaries and the doc tests)
        if: matrix.part == 'binaries'
        working-directory: src-tauri
        run: |
          cargo test --locked --bins --test '*'
          cargo test --locked --doc
      # The local owner path needs no macOS APIs and no desktop features (#786).
      - name: Local issue starts without desktop features
        if: matrix.part == 'binaries'
        working-directory: src-tauri
        run: cargo test --locked --no-default-features --features local-ui --lib control::issue_tests
      # `binaries` builds every dependency the four parts do, so it alone
      # saves: also when a test failed, as long as its build was whole.
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos-rust-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      rust: ${{ steps.select.outputs.rust }}
      frontend: ${{ steps.select.outputs.frontend }}
      phone: ${{ steps.select.outputs.phone }}
      mac-webkit: ${{ steps.select.outputs.mac-webkit }}
      machines: ${{ steps.machines.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # What this run needs: macOS, the Rust jobs, the frontend jobs, the phone
      # app, the mac-only WebKit checks. Everything, unless it is a pull request.
      - name: Select what this change needs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 infra/ci-runners/macos-rust.py --base "$PR_BASE" --head "$PR_HEAD"
          else
            python3 infra/ci-runners/macos-rust.py --all
          fi
      # machine-compat needs a macOS runner too; it runs for the changes
      # machines-e2e runs for (scripts/machine-e2e/relevant.py).
      - name: Select the machine compatibility matrix
        id: machines
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-e2e/relevant.py

  # Runs when the selector asks for it: every push to main, nightly, manual
  # runs, and a pull request that touches code macOS builds differently.
  # Skipped otherwise. `check` does not wait for it, on any event: a pull
  # request shows its result without being held to it, and every other run is
  # held to it by `check-macos`.
  #
  # A selected pull request gets the Swift tests, the icon checks, the helper,
  # one build of the library's tests, and the tests of the Apple-only and
  # system-dependent modules (`macos-rust.py --filters`). The whole suite and
  # macOS Clippy run on main, nightly and manual runs.
  #
  # Pushes to main share one group: while one runs, only the newest waiting
  # commit keeps its place, and an older one still waiting is cancelled (its
  # `check-macos` fails). Merges land in bursts and each run is long; a commit
  # already superseded does not need the runner more than the newest one does.
  macos-native:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.required == 'true'
    concurrency:
      group: ci-macos-native-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: macos-latest
    # A cold run, every dependency built, took 1 h 52 min (run 45448416407:
    # Clippy 15 + 15, the test build 35, the full suite 42 with the ordinary
    # library's build in it). A warm one builds only this crate. The limit
    # leaves a third over the cold run for a slow runner.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify source and compiled app icons
        run: |
          python3 -m pip install Pillow==11.1.0
          python3 scripts/test_icons.py
          python3 scripts/test_packaged_icons.py
          python3 scripts/test_compiled_icons.py

      - name: Install ripgrep for the Rust security tests
        run: brew install ripgrep

      # rust-toolchain.toml decides the channel and pulls in clippy.
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && cargo clippy --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-macos-native-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-macos-native-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-macos-native-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-

      # tauri-build packages the frontend output into the Rust build.
      # `frontend` runs tsc; this needs only the built app.
      - name: Build the frontend
        run: pnpm exec vite build

      # The computer-use helper is a Swift package with its own unit tests.
      # It is built before the Rust checks so tauri-build packages a real
      # helper rather than the empty stand-in build.rs creates.
      - name: swift test (computer-use helper)
        run: swift test --package-path native/computer-use-macos

      - name: build the computer-use helper app
        id: helper
        run: node scripts/build-computer-macos.mjs

      # One compiler working on this crate holds over 5 GB, and this runner has
      # 7 GB. --all-targets and a full cargo test each start two at once (the
      # library and its test build) and the runner swaps. Each pair of steps
      # below does the same work one compiler at a time: the second step builds
      # only what the first did not. The first clippy step names an integration
      # test because that checks the library as --all-targets will, with the
      # test-only dependency features on.
      #
      # clippy runs ahead of the tests, on a pull request too: a lint in an
      # Apple-only function has no other check before merge. It does not spare
      # the tests a second compile. The crate is compiled again by the cargo
      # command after its first test build, wherever clippy stands: 34 minutes
      # then 28 with clippy left out (#1518's first run), 9 min 53 s then
      # 11 min 9 s inside the test step with clippy in front (its second).
      # Which input changes between the two is not found.
      #
      # A clippy failure fails the job and does not stop the tests: the build
      # and the suite below run whenever the steps before clippy passed, so a
      # lint on main does not hide what the suite would have said. No step
      # here may continue on error.
      - name: clippy (the library by itself)
        working-directory: src-tauri
        run: cargo clippy --locked --test serde_field_naming -- -D warnings

      - name: clippy
        if: ${{ !cancelled() && steps.helper.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Built once. `tauri::generate_context!` writes the app's compressed
      # assets into the crate's OUT_DIR while the crate compiles, and the crate
      # embeds them, so to cargo they are inputs newer than the build, and the
      # next cargo command compiles the crate again ("Dirty raccoon: the file
      # `target/debug/build/raccoon/<hash>/out/<checksum>` has changed, 4m 18s
      # after last build", cargo -v): 21 to 24 minutes on this runner. The
      # files are named by a checksum of their content, so an old date says
      # nothing false; tauri-codegen 2.7 dates them back itself, and this step
      # does it until the lock file has that release. OUT_DIR is the folder
      # cargo names for the crate's build script, not a path searched for:
      # cargo 1.100 keeps every unit's output, the test binary among them,
      # under build/raccoon/<hash>/out, and dating those back makes them stale.
      # The second `--no-run` must find every unit fresh: if the crate is
      # compiled a second time again, the job fails here and prints cargo's
      # reason. The commands are infra/ci-runners/cargo-build-once.sh, which
      # sets pipefail itself; linux-rust-tests (binaries) builds through it too.
      - name: build the library's tests by themselves
        id: build
        if: ${{ !cancelled() && steps.helper.outcome == 'success' }}
        working-directory: src-tauri
        run: ../infra/ci-runners/cargo-build-once.sh --lib

      # Saved as soon as the dependencies are built, before any test runs: a
      # suite that fails or runs out of time must not leave every later run to
      # build them again. The tests below need this crate's output, so the
      # cache is made from a copy (APFS clones, no second copy on disk) with
      # that output removed, and the build itself is put back untouched.
      - name: Leave this crate's own output out of the cache
        id: aside
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: |
          mv target "$RUNNER_TEMP/target"
          cp -cpR "$RUNNER_TEMP/target" target
          cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.aside.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Put this crate's own output back
        if: ${{ !cancelled() && steps.aside.outcome != 'skipped' }}
        working-directory: src-tauri
        run: |
          test -d "$RUNNER_TEMP/target"
          rm -rf target && mv "$RUNNER_TEMP/target" target

      - name: cargo test (a pull request, the Apple-only and system-dependent modules)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        working-directory: src-tauri
        run: cargo test --locked --lib -- $(python3 ../infra/ci-runners/macos-rust.py --filters)

      - name: cargo test (main, nightly and manual runs, the full macOS suite)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        working-directory: src-tauri
        run: cargo test --locked

  # The headless runtime a cloud workspace boots. The runner has no WebView,
  # GTK or ALSA development packages, so a GUI dependency fails the build.
  headless-serve:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tests build unoptimised ([profile.test]). Build the binary the
      # same way, so they reuse its library instead of compiling it twice.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-headless-serve-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-headless-serve-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-headless-serve-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      - name: Build terminalx-serve
        id: build
        working-directory: src-tauri/serve
        run: cargo build --locked --bin terminalx-serve
      - name: No GUI crates in its dependency tree
        working-directory: src-tauri/serve
        run: |
          cargo tree --locked -e normal,build > "$RUNNER_TEMP/serve-tree.txt"
          ! grep -E '(^|[^a-z])(tauri|wry|webkit2gtk|gtk|cpal|alsa-sys)[ -]' "$RUNNER_TEMP/serve-tree.txt"
      - name: Clippy
        working-directory: src-tauri/serve
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Owner hook round trip and lost-transport denial
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test owner_pretool
          cargo test --locked --test local_lifetime owner_hook_process_fails_closed_when_its_socket_disappears
      - name: Replacing an older runtime with the bundled one (#730)
        working-directory: src-tauri/serve
        run: |
          cargo test --locked --test local_lifetime a_runtime_names_what_stopping_it_would_cut_short_and_stops_by_itself_only_without_any
          cargo test --locked --test local_lifetime a_runtime_says_its_build_and_turns_and_a_retired_one_is_replaced_by_the_next_launch
      - name: Handing the runtime over without stopping what it runs (#765)
        working-directory: src-tauri/serve
        run: cargo test --locked --test local_handover
      - name: CLI issue starts in the shipped runtime (#786)
        working-directory: src-tauri/serve
        run: cargo test --locked --features local-ui --test local_issue_start
      - name: A lead lists and stops the sessions it started (PRO-270)
        working-directory: src-tauri/serve
        run: cargo test --locked --test session_parent
      - name: A headless runtime lets a paired computer operate it (PRO-341)
        working-directory: src-tauri/serve
        run: cargo test --locked --test machine_host
      - name: A person pairs from a headless server's terminal; an update hands the runtime over (PRO-353)
        working-directory: src-tauri/serve
        run: cargo test --locked --test headless_pair --test headless_update
      - name: Self-test (start, shell PTY, clean exit)
        working-directory: src-tauri/serve
        run: ../target/debug/terminalx-serve --data-dir "$RUNNER_TEMP/serve" --project-root "$GITHUB_WORKSPACE" --runtime-kind cloud-workspace --self-test
      - name: Self-test under the cloud workspace unit's sandbox (ProtectHome, own user)
        run: bash scripts/remote-runtime/cloud-unit-self-test.sh src-tauri/target/debug/terminalx-serve
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Every test binary of the headless runtime's crate (`src-tauri/serve/tests`)
  # that no other job runs: machine_compat, machines_e2e and machine_routes have
  # jobs of their own, and headless-serve runs local_issue_start with the
  # feature it needs. A new file under tests/ runs here without being named.
  # It builds what headless-serve builds, so it restores that job's cache and
  # saves none.
  #
  # They run under cargo-nextest's `ci` profile, as the library's tests do:
  # every test in a process of its own and the binaries side by side, where
  # `cargo test` ran the binaries one after another (433 s in run 45442275413).
  # The slowest test is then the floor. local_supervisor has no libtest
  # harness (`harness = false`), so nextest cannot list it: it runs under
  # `cargo test` in a step of its own, as it did before.
  serve-tests:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # As headless-serve: the binary and the tests share one library build.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No limit of its own: the job's bounds it (a slow mirror trips neither the
      # stall option nor a retry).
      - name: Install the tools the tests run
        run: sudo infra/ci-runners/apt-mirrors.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y zsh ripgrep
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version && command -v rg && command -v zsh
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      # The release linux-rust-tests installs, by version and by the SHA-256 of its archive.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.152"
          NEXTEST_SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/nextest.tar.gz" "https://get.nexte.st/$NEXTEST_VERSION/x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-headless-serve-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-headless-serve-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-headless-serve-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      - name: Build the runtime the tests start
        working-directory: src-tauri/serve
        run: cargo build --locked --bin terminalx-serve
      - name: cargo nextest (every serve test binary without a job of its own)
        working-directory: src-tauri/serve
        run: |
          set -o pipefail
          tests=()
          for file in tests/*.rs; do
            name=$(basename "$file" .rs)
            case "$name" in
              machine_compat|machines_e2e|machine_routes|local_issue_start) ;;
              local_supervisor) ;;
              *) tests+=(--test "$name") ;;
            esac
          done
          cargo nextest run --locked --profile ci --bins "${tests[@]}" 2>&1 | tee "$RUNNER_TEMP/nextest.log"
      - name: cargo test (the serve test binaries without libtest's harness)
        if: ${{ !cancelled() }}
        working-directory: src-tauri/serve
        run: cargo test --locked --test local_supervisor
      # As in the library's parts: a flaky test passed on a retry its override
      # allows; a leaky one left a process or a pipe open.
      - name: Name the flaky and leaky tests in the summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Flaky and leaky tests, serve-tests"
            echo '```'
            grep -aE '^[[:space:]]*(FLAKY|LEAK)[[:space:]]' "$RUNNER_TEMP/nextest.log" | sort -u || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serve-junit
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: warn

  # PRO-354: this build against the previous two released runtimes, both
  # ways (docs/MACHINES.md "Versions and updates"). The released runtimes
  # ship only inside the macOS app, so this runs on macOS. The test build is
  # the headless runtime's (no desktop features), which macos-native does
  # not build, so the job keeps its own cache.
  #
  # Selected like machines-e2e (every push, schedule and dispatch; a pull
  # request that touches the machines), and on main only the newest waiting
  # commit keeps its place, as macos-native.
  machine-compat:
    needs: macos-rust-changes
    if: needs.macos-rust-changes.outputs.machines == 'true'
    concurrency:
      group: ci-machine-compat-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # As headless-serve: the binary and the tests share one library build.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Show the Rust toolchain
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-machine-compat-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-machine-compat-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-machine-compat-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      # The two newest v* releases before this build's version, each
      # archive checked against its SHA256SUMS before the runtime comes out.
      - name: Fetch and verify the previous two released runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-compat/fetch_releases.py --out "$RUNNER_TEMP/machine-compat"
      - name: Build the compatibility matrix
        id: build
        working-directory: src-tauri/serve
        run: cargo test --locked --test machine_compat --no-run
      - name: This build against the previous two runtimes
        working-directory: src-tauri/serve
        env:
          TERMINALX_MACHINE_COMPAT: ${{ runner.temp }}/machine-compat/manifest.json
        run: cargo test --locked --test machine_compat -- --test-threads=1
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # PRO-358: two machines end to end. The desktop's own pairing client and
  # machine supervisor against two runtimes in their own processes, "Mac
  # mini" on this runner and "dev-server" in a Linux container, beside the
  # operating computer's own runtime (tests/machines_e2e.rs, built and run by
  # scripts/machine-e2e/run.py), and the machine routes through a relay in
  # the test (tests/machine_routes.rs). `check` fails on a skipped job, so this
  # always runs and decides in a step: every push, schedule and dispatch, and
  # a pull request that touches the machines (scripts/machine-e2e/relevant.py).
  # A pull request gets ten minutes; main gets more, so a cold cache can be
  # built and saved there for pull requests to restore. Previous-release
  # compatibility is machine-compat (PRO-354), not this.
  # .github/workflows/machines-e2e-breaks.yml proves a deliberate break in
  # the pairing check or the project scoping fails these scenarios.
  machines-e2e:
    runs-on: ubuntu-latest
    # The ten-minute budget is checked at the end, for a run with a warm
    # cache; a cold one (the first after a Cargo.lock change) gets room to
    # build and save one.
    timeout-minutes: 25
    env:
      # As headless-serve: the binary and the tests share one library build.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      # The dev-server container must run here: its absence fails the tests.
      TERMINALX_E2E_REQUIRE_LINUX: "1"
    steps:
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge commit and its base, for relevant.py's fallback.
          fetch-depth: 2
      - name: Does this change touch the machines?
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/machine-e2e/relevant.py
      - name: Show the Rust toolchain
        if: steps.relevant.outputs.run == 'true'
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        if: steps.relevant.outputs.run == 'true'
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-machines-e2e-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-machines-e2e-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-machines-e2e-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      - name: Two machines end to end (machines_e2e, machine_routes), timed
        if: steps.relevant.outputs.run == 'true'
        run: python3 -I scripts/machine-e2e/run.py tests machines_e2e machine_routes
      - name: The job's run time, against its ten minutes
        if: always() && steps.relevant.outputs.run == 'true'
        env:
          WARM: ${{ steps.cargo-cache.outputs.cache-matched-key != '' }}
        run: |
          seconds=$(( $(date +%s) - JOB_STARTED ))
          line="machines-e2e took $((seconds / 60)) min $((seconds % 60)) s (cache: $([ "$WARM" = true ] && echo warm || echo cold))"
          echo "$line"
          echo "**$line**; the budget is 10 min with a warm cache." >> "$GITHUB_STEP_SUMMARY"
          if [ "$WARM" = true ] && [ "$seconds" -gt 600 ]; then
            echo "::error::machines-e2e took over ten minutes with a warm cache"
            exit 1
          fi
      # Saved from main, schedule and dispatch runs only: uploading the
      # target directory would eat a pull request's ten minutes.
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ steps.relevant.outputs.run == 'true' && github.event_name != 'pull_request' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  desktop-platforms:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is off until a Windows runner is set up: the job never
        # got a runner and left every run unfinished. Add it back here; the
        # Windows-only steps below are still in place.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      # On Linux this job runs no Rust: linux-rust checks every target and
      # linux-rust-tests runs the tests, the local owner path among them. The
      # toolchain and the cache are for the other platforms.
      - name: Show the Rust toolchain
        if: runner.os != 'Linux'
        id: toolchain
        run: |
          rustup show && cargo --version
          echo "rustc=$(rustc --version | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo cache
        if: runner.os != 'Linux'
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-v5-desktop-platforms-${{ env.CI_CACHE_SCOPE }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ci-v5-desktop-platforms-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
            ci-v5-desktop-platforms-main-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc }}-
      # `frontend` builds the frontend on Linux; the other platforms build it
      # here for the Rust steps below.
      - name: Verify the off-macOS helper build is a no-op
        run: pnpm build:computer-macos
      - name: Build the frontend
        if: runner.os != 'Linux'
        run: pnpm exec vite build
      # On Linux, linux-rust already checks every target (clippy),
      # linux-rust-tests runs these tests in its full suite, and vitest runs
      # every script test: the steps marked "not Linux" are for the other
      # platforms.
      - name: Platform build
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Computer contract tests
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: "cargo test --lib computer::"
      - name: Windows process exit observation
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib process_probe_distinguishes_running_from_confirmed_exit
      - name: Windows pipe tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: "cargo test --lib pipe_transport::"
      - name: Windows control and hook integration
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --lib named_pipe_serves_authenticated_control_and_hook_frames
      - name: Desktop script input safety tests
        if: runner.os != 'Linux'
        run: pnpm vitest run scripts/computer-use-modifier-safety.test.mjs scripts/computer-use-mouse-button-routing.test.mjs scripts/computer-use-windows-horizontal-scroll.test.mjs
      - name: Linux render tests
        if: runner.os == 'Linux'
        run: |
          python3 native/computer-use-linux/runtime_render_test.py
          python3 native/computer-use-linux/launcher_test.py
      - name: Windows render tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./native/computer-use-windows/runtime-render.test.ps1
      - name: Windows render tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/computer-use-windows/runtime-render.test.ps1
      - name: Leave this crate's own output out of the cache
        id: clean
        if: ${{ runner.os != 'Linux' && !endsWith(steps.cargo-cache.outputs.cache-matched-key, hashFiles('src-tauri/Cargo.lock')) }}
        working-directory: src-tauri
        run: cargo clean --locked -p raccoon -p terminalx-serve && rm -rf target/debug/incremental
      - name: Save the cargo cache
        if: ${{ steps.clean.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  check:
    # Keep the exact required status and fail closed on failed/cancelled/skipped jobs.
    #
    # Not macos-native or webkit-mac-only: a pull request is not held to the
    # macOS Rust suite or to the mac-only WebKit checks (the owner's decisions,
    # 24 November 2026). On a pull request the selector still runs each when the
    # change needs it, and it reports there as its own job; `check` does not
    # wait for it. Every other run is held to both by `check-macos` below.
    if: always()
    needs: [frontend, phone-app, vitest, webkit-layout-linux, webkit-layout, linux-rust, linux-rust-tests, macos-rust-changes, headless-serve, serve-tests, machine-compat, machines-e2e, desktop-platforms, legacy-runtime-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must succeed. A job named here may be skipped instead, and
      # only when the selector, which must itself succeed, answered "false" to
      # the question beside it: any other skip is a job that did not run.
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            {"machine-compat": "machines",
             "linux-rust": "rust", "linux-rust-tests": "rust", "headless-serve": "rust", "serve-tests": "rust",
             "vitest": "frontend", "webkit-layout-linux": "frontend", "phone-app": "phone"} as $selected
            | .["macos-rust-changes"] as $selector
            | $selector.result == "success"
              and ([to_entries[] | .key as $job | .value.result
                    | . == "success"
                      or (. == "skipped"
                          and $selected[$job] != null
                          and $selector.outputs[$selected[$job]] == "false")]
                   | all)'
  check-macos:
    # Pushes to main, nightly and manual runs: everything `check` requires, the
    # full macOS Rust suite and the mac-only WebKit checks. On these the
    # selector answers "true" to everything, so macos-native and webkit-mac-only
    # always run and must succeed. Not a required status; release-serve.yml
    # follows the run's own conclusion, which a failed job here, in
    # macos-native or in webkit-mac-only makes a failure.
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [check, macos-native, webkit-mac-only]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require check and the macOS jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e '(keys == ["check", "macos-native", "webkit-mac-only"]) and all(.[]; .result == "success")'
