name: CI

# The four checks a change has to pass, in the order they fail fastest.
# macOS because TerminalX is macOS-only: the Rust side links AppKit, AVFoundation
# and Speech, and will not build anywhere else.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml decides the channel and pulls in clippy.
      - name: Show the Rust toolchain
        run: rustup show && cargo --version && cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: tsc
        run: pnpm exec tsc --noEmit

      - name: vitest
        run: pnpm vitest run

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
