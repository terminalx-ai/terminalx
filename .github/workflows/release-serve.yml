name: Release terminalx-serve

# Publishes the headless cloud-workspace runtime. The TerminalX cloud server
# polls this repository's releases and provisions the newest compatible
# `terminalx-serve-linux-x64`, checked against the release's SHA256SUMS and
# gated on the `protocol` in `terminalx-serve.json`. Two paths:
#
# - Runtime prereleases. After CI passes on a push to main, if src-tauri/
#   changed since the newest runtime prerelease (or by hand from main), build
#   and publish `runtime-v<serve version>-<UTC yyyymmddHHMMSS>-<sha7>` as a
#   prerelease. Never marked latest, so the desktop updater's
#   /releases/latest/download/latest.json is never affected. The newest 10
#   are kept.
# - Desktop releases. When a desktop release is published (or by hand with
#   its tag), attach the runtime to it and add its lines to its SHA256SUMS.
#
# Nothing here creates, edits or deletes any other release, and nothing
# touches latest.json. Built on Ubuntu 22.04, so the glibc floor stays at or
# below 2.35 (Ubuntu 22.04 and 24.04, Debian 12).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Empty: publish a runtime prerelease from main. A desktop release tag
          (e.g. v0.2.5): attach the runtime to that published release.
        required: false
        type: string

concurrency:
  group: release-serve-${{ github.event.release.tag_name || inputs.tag || 'runtime' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUNTIME_TAG_PATTERN: '^runtime-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{14}-[0-9a-f]{7}$'
  KEEP_RUNTIME_RELEASES: 10

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      built_at: ${{ steps.plan.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          runtime_releases() {
            gh api --paginate "repos/$GH_REPO/releases" \
              --jq '.[] | select(.prerelease and (.draft | not)) | [.created_at, .tag_name] | @tsv' \
              | while IFS=$'\t' read -r created tag; do
                  if [[ "$tag" =~ $RUNTIME_TAG_PATTERN ]]; then printf '%s\t%s\n' "$created" "$tag"; fi
                done | sort -r
          }
          skip() { echo "::notice::$1"; out mode skip; exit 0; }
          runtime() {
            local sha=$1 version
            version=$(git show "$sha:src-tauri/serve/Cargo.toml" | sed -n 's/^version = "\([0-9.]*\)"$/\1/p' | head -1)
            [ -n "$version" ] || { echo "::error::no serve version at $sha"; exit 1; }
            local stamp
            stamp=$(date -u +%Y%m%d%H%M%S)
            out mode runtime
            out ref "$sha"
            out tag "runtime-v$version-$stamp-${sha:0:7}"
            out built_at "$(date -u -d "${stamp:0:8} ${stamp:8:2}:${stamp:10:2}:${stamp:12:2}" +%Y-%m-%dT%H:%M:%SZ)"
          }
          attach() {
            local tag=$1
            [[ "$tag" =~ $RUNTIME_TAG_PATTERN ]] && skip "$tag is a runtime prerelease"
            local state
            state=$(gh release view "$tag" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
            [ "$state" = "false false" ] || skip "$tag is not a published desktop release ($state)"
            out mode attach
            out ref "$tag"
            out tag "$tag"
            out built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            exit 0
          }
          case "$EVENT" in
            release)
              [ "$RELEASE_PRERELEASE" = true ] && skip "prereleases get no runtime attached"
              attach "$RELEASE_TAG" ;;
            workflow_dispatch)
              if [ -n "$INPUT_TAG" ]; then attach "$INPUT_TAG"; fi
              [ "$GITHUB_REF" = refs/heads/main ] || skip "runtime prereleases are built from main only"
              runtime "$GITHUB_SHA" ;;
            workflow_run)
              [ "$RUN_CONCLUSION" = success ] || skip "CI concluded $RUN_CONCLUSION"
              [ "$RUN_EVENT" = push ] && [ "$RUN_BRANCH" = main ] || skip "not a push to main"
              # Changed since the newest runtime prerelease, not only in the
              # last commit, so a multi-commit push or a skipped run is caught.
              previous=$(runtime_releases | head -1 | cut -f2)
              if [ -n "$previous" ]; then
                base=$(git rev-list -n 1 "refs/tags/$previous" 2>/dev/null || true)
                if [ -n "$base" ] && git merge-base --is-ancestor "$base" "$RUN_SHA"; then
                  git diff --quiet "$base" "$RUN_SHA" -- src-tauri && skip "src-tauri unchanged since $previous"
                fi
              fi
              runtime "$RUN_SHA" ;;
            *) skip "unhandled event $EVENT" ;;
          esac

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: terminalx-serve-linux-x64
          - runner: ubuntu-22.04-arm
            asset: terminalx-serve-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - name: The ref carries the serve crate and its runtime protocol
        run: |
          test -f src-tauri/serve/Cargo.toml || { echo "::error::no src-tauri/serve"; exit 1; }
          grep -q '^runtime-protocol = [0-9]' src-tauri/serve/Cargo.toml || { echo "::error::no runtime-protocol in src-tauri/serve/Cargo.toml"; exit 1; }
      - name: Show the Rust toolchain
        run: rustup show && cargo --version
      - name: Build terminalx-serve (release)
        working-directory: src-tauri/serve
        run: cargo build --locked --release --bin terminalx-serve
      - name: Self-test (start, shell PTY, clean exit)
        working-directory: src-tauri/serve
        run: ../target/release/terminalx-serve --data-dir "$RUNNER_TEMP/serve" --project-root "$GITHUB_WORKSPACE" --runtime-kind cloud-workspace --self-test
      - name: Report the glibc floor
        run: objdump -T src-tauri/target/release/terminalx-serve | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Stage the asset
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp src-tauri/target/release/terminalx-serve "$RUNNER_TEMP/out/${{ matrix.asset }}"
          chmod 0755 "$RUNNER_TEMP/out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      REF: ${{ needs.plan.outputs.ref }}
      TAG: ${{ needs.plan.outputs.tag }}
      BUILT_AT: ${{ needs.plan.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: src-tauri/serve/Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write terminalx-serve.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tomllib
          with open('src-tauri/serve/Cargo.toml', 'rb') as f:
              crate = tomllib.load(f)['package']
          manifest = {
              'version': crate['version'],
              'protocol': int(crate['metadata']['terminalx']['runtime-protocol']),
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'builtAt': os.environ['BUILT_AT'],
          }
          with open('assets/terminalx-serve.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest))
          PY
      - name: Publish the runtime prerelease
        if: env.MODE == 'runtime'
        working-directory: assets
        run: |
          set -euo pipefail
          [[ "$TAG" =~ $RUNTIME_TAG_PATTERN ]] || { echo "::error::bad runtime tag $TAG"; exit 1; }
          files=(terminalx-serve-linux-x64 terminalx-serve-linux-arm64 terminalx-serve.json)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" "${files[@]}" SHA256SUMS \
            --target "$REF" --prerelease --latest=false \
            --title "$TAG" \
            --notes "Cloud workspace runtime (terminalx-serve) built from $REF. Runtime-only prerelease: no desktop app, never marked latest."
      - name: Prune runtime prereleases beyond the newest ${{ env.KEEP_RUNTIME_RELEASES }}
        if: env.MODE == 'runtime'
        run: |
          set -euo pipefail
          # Only prereleases whose tag is a runtime tag are ever candidates.
          runtime_releases() {
            gh api --paginate "repos/$GH_REPO/releases" \
              --jq '.[] | select(.prerelease and (.draft | not)) | [.created_at, .tag_name] | @tsv' \
              | while IFS=$'\t' read -r created tag; do
                  if [[ "$tag" =~ $RUNTIME_TAG_PATTERN ]]; then printf '%s\t%s\n' "$created" "$tag"; fi
                done | sort -r
          }
          runtime_releases \
            | tail -n +"$((KEEP_RUNTIME_RELEASES + 1))" | cut -f2 \
            | while read -r old; do
                [[ "$old" =~ $RUNTIME_TAG_PATTERN ]] || continue
                echo "deleting $old"
                gh release delete "$old" --cleanup-tag --yes
              done
      # Attach path: one job owns SHA256SUMS, existing lines stay, and only
      # lines for these files are replaced, so a re-run never duplicates them.
      - name: Attach to the desktop release
        if: env.MODE == 'attach'
        working-directory: assets
        run: |
          set -euo pipefail
          ls -l
          gh release download "$TAG" --pattern SHA256SUMS --output SHA256SUMS.old || : > SHA256SUMS.old
          files=(terminalx-serve-linux-x64 terminalx-serve-linux-arm64 terminalx-serve.json)
          grep -Ev '  (terminalx-serve-linux-[a-z0-9]+|terminalx-serve\.json)$' SHA256SUMS.old > SHA256SUMS || true
          sha256sum "${files[@]}" >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --clobber
