[package]
name = "tx439-detector-adapter"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone integration prototype; not a production dependency yet.
[workspace]

[dependencies]
# Exactly the application's runtime. No new GGML copy or ASR upgrade.
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["metal"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
